
name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate PR title
        uses: Namchee/conventional-pr@v0.16.0
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}
          title_pattern: '^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert|improve)(\([\w\-.,/ ]+\))?!?: .+$'
          issue: false
          body: false


