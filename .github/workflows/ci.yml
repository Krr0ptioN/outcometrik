name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'libs/**'

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: ./.github/actions/setup-workspace
      - run: pnpm nx run-many -t lint --parallel=3
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-db
      - run: pnpm nx run-many -t test --parallel=3
      - name: Report Backend Tests
        uses: ./.github/actions/report-tests
        if: success() || failure()
        with:
          name: Backend Tests (Pytest)
          path: 'apps/api/reports/junit-api.xml'
      - name: Report Frontend Tests
        uses: ./.github/actions/report-tests
        if: success() || failure()
        with:
          name: Frontend Tests (Vitest)
          path: '**/reports/junit.xml'
          upload-artifact: 'true'
          artifact-name: junit-test-reports
          artifact-path: '**/reports/junit*.xml'
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: ./.github/actions/setup-workspace
      - run: pnpm nx run-many -t typecheck --parallel=2
      - run: pnpm nx run-many -t build --parallel=2
  e2e:
    needs: [lint, test, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-playwright
      - run: pnpm nx run-many -t e2e --parallel=1
      - name: Report E2E Tests
        uses: ./.github/actions/report-tests
        if: success() || failure()
        with:
          name: E2E Tests (Playwright)
          path: 'apps/web/reports/junit-e2e.xml'
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          compression-level: 9
      - name: Generate CI Summary
        uses: ./.github/actions/generate-summary
        if: ${{ !cancelled() }}
        with:
          status: ${{ job.status }}


