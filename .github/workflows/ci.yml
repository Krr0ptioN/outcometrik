name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: feat, fix, docs, chore, refactor, test, ci, build, perf
  lint:
    needs: [title]
    if: >-
      always() && (needs.title.result == 'success' || needs.title.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm nx run-many -t lint --parallel=3
  test:
    needs: [title]
    if: >-
      always() && (needs.title.result == 'success' || needs.title.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm nx run-many -t test --parallel=3
  build:
    needs: [title]
    if: >-
      always() && (needs.title.result == 'success' || needs.title.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm nx run-many -t build --parallel=2
  e2e:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx run-many -t e2e --parallel=1
