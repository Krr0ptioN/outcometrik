name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'libs/**'

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: ./.github/actions/setup-workspace
      - run: pnpm nx run-many -t lint --parallel=3
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: outcometrik
          POSTGRES_USER: outcometrik
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outcometrik -d outcometrik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${{ github.run_id }}
      POSTGRES_DB: outcometrik
      POSTGRES_USER: outcometrik
      POSTGRES_PASSWORD: ${{ github.run_id }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: ./.github/actions/setup-workspace
      - run: pnpm nx run-many -t test --parallel=3
      - name: Report Backend Tests
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: Backend Tests (Pytest)
          path: 'apps/api/reports/junit-api.xml'
          reporter: java-junit
      - name: Report Frontend Tests
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: Frontend Tests (Vitest)
          path: '**/reports/junit.xml'
          reporter: java-junit
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: junit-test-reports
          path: '**/reports/junit*.xml'
          retention-days: 7
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: ./.github/actions/setup-workspace
      - run: pnpm nx run-many -t typecheck --parallel=2
      - run: pnpm nx run-many -t build --parallel=2
  e2e:
    needs: [lint, test, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: ./.github/actions/setup-workspace
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx run-many -t e2e --parallel=1
      - name: Report E2E Tests
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: E2E Tests (Playwright)
          path: 'apps/web/reports/junit-e2e.xml'
          reporter: java-junit
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          compression-level: 9
      - name: Generate CI Summary
        if: ${{ !cancelled() }}
        run: |
          echo "### CI Workflow Run Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY

