name: Generate CI Summary
description: Append a structured workflow execution summary to GITHUB_STEP_SUMMARY.

inputs:
  title:
    description: Summary title
    required: false
    default: 'CI Workflow Run Summary 🚀'
  status:
    description: Job or workflow status
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Generate summary
      shell: bash
      run: |
        echo "### ${{ inputs.title }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Trigger**: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
        if [ -n "${{ inputs.status }}" ]; then
          echo "- **Status**: \`${{ inputs.status }}\`" >> "$GITHUB_STEP_SUMMARY"
        fi
