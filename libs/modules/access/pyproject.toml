[project]
name = "outcometrik-access"
version = "0.1.0"
description = "Scoped authorization for Outcometrik"
requires-python = ">=3.13"
dependencies = ["Django>=5.2,<6", "djangorestframework>=3.16,<4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["access"]

[tool.ruff]
line-length = 100
target-version = "py313"
