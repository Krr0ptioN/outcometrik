[project]
name = "outcometrik-api"
version = "0.1.0"
description = "Outcometrik API"
requires-python = ">=3.13"
dependencies = [
  "outcometrik-access",
  "outcometrik-calc",
  "celery[redis]>=5.5,<6",
  "Django>=5.2,<6",
  "djangorestframework>=3.16,<4",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["health", "academic", "../../libs/modules/access/access", "../../libs/modules/calc/calc"]
addopts = "--junitxml=reports/junit-api.xml -o junit_family=xunit2"


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["RUF012"]

[tool.uv.sources]
outcometrik-access = { path = "../../libs/modules/access", editable = true }
outcometrik-calc = { path = "../../libs/modules/calc", editable = true }
