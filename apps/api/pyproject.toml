[project]
name = "cse-3xx-api"
version = "0.1.0"
description = "CSE-3XX Django REST API"
requires-python = ">=3.13"
dependencies = [
  "celery[redis]>=5.5,<6",
  "Django>=5.2,<6",
  "djangorestframework>=3.16,<4",
  "gunicorn>=23,<24",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
