name: ${COMPOSE_PROJECT_NAME:-cse-3xx}
services:
  api:
    build:
      context: ../apps/api
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../apps/api:/app
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      POSTGRES_DB: ${POSTGRES_DB:-cse3xx}
      POSTGRES_USER: ${POSTGRES_USER:-cse3xx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: ${COMPOSE_POSTGRES_HOST:-db}
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: ${COMPOSE_CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${COMPOSE_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: ../apps/api
    command: celery -A config worker --loglevel=INFO
    volumes:
      - ../apps/api:/app
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      POSTGRES_DB: ${POSTGRES_DB:-cse3xx}
      POSTGRES_USER: ${POSTGRES_USER:-cse3xx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: ${COMPOSE_POSTGRES_HOST:-db}
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: ${COMPOSE_CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${COMPOSE_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cse3xx}
      POSTGRES_USER: ${POSTGRES_USER:-cse3xx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cse3xx} -d $${POSTGRES_DB:-cse3xx}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
